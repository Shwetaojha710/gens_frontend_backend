name: Deploy GENS

on:
  push:
    branches:
      - main      # Live  → gens.demoquaeretech.in
      - staging   # Test  → gensdemo.demoquaeretech.in
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set deploy environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_ROOT=/var/www/html/gens.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "SITE_HOST=gens.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "PM2_NAME=gens" >> $GITHUB_OUTPUT
            echo "ENV_NAME=live" >> $GITHUB_OUTPUT
            echo "HEALTH_URL=https://gens.demoquaeretech.in" >> $GITHUB_OUTPUT
          else
            echo "APP_ROOT=/var/www/html/gensdemo.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "SITE_HOST=gensdemo.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "PM2_NAME=gens-staging" >> $GITHUB_OUTPUT
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "HEALTH_URL=https://gensdemo.demoquaeretech.in" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Angular Frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Verify frontend build output
        id: buildmeta
        run: |
          if [ ! -f frontend/dist/gens-frontend/browser/index.html ]; then
            echo "ERROR: frontend build missing index.html"
            ls -la frontend/dist/gens-frontend/ || true
            exit 1
          fi
          NEW_MAIN=$(ls frontend/dist/gens-frontend/browser/main-*.js | head -1 | xargs -n1 basename)
          echo "NEW_MAIN=$NEW_MAIN"
          echo "NEW_MAIN=$NEW_MAIN" >> $GITHUB_OUTPUT
          echo "Frontend build OK ($NEW_MAIN)"

      - name: Syntax-check backend before deploy
        working-directory: backend
        run: |
          node --check server.js
          node --check app/controller/tenant/appApi.js
          node --check app/helper/helper.js
          node --check app/models/empPersonal.js
          echo "Backend syntax OK"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "ERROR: SERVER_HOST secret is empty"
            exit 1
          fi

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # Find the folder that currently serves the LIVE site's main-*.js
      # (more reliable than guessing nginx root / APP_ROOT)
      - name: Detect live web roots
        id: webroot
        run: |
          set -e
          APP_ROOT="${{ steps.env.outputs.APP_ROOT }}"
          SITE_HOST="${{ steps.env.outputs.SITE_HOST }}"
          HEALTH_URL="${{ steps.env.outputs.HEALTH_URL }}"

          SERVED_MAIN=$(curl -sL --max-time 20 "${HEALTH_URL}/" \
            | grep -oE 'main-[A-Za-z0-9]+\.js' | head -1 || true)
          echo "Currently served bundle: ${SERVED_MAIN:-unknown}"

          ROOTS=$(ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            APP_ROOT="$APP_ROOT" SITE_HOST="$SITE_HOST" SERVED_MAIN="$SERVED_MAIN" bash -s << 'EOS'
            set -e
            ROOTS=""

            # A) Locate folder containing the JS file the public site is serving
            if [ -n "$SERVED_MAIN" ]; then
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                d=$(dirname "$f")
                case " $ROOTS " in
                  *" $d "*) ;;
                  *) ROOTS="$ROOTS $d" ;;
                esac
              done < <(find /var/www /home /usr/share/nginx -type f -name "$SERVED_MAIN" 2>/dev/null | head -20)
            fi

            # B) nginx -T root for this host
            if command -v nginx >/dev/null 2>&1; then
              CONF=$(nginx -T 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                NR=$(printf '%s\n' "$CONF" | awk -v host="$SITE_HOST" '
                  $1=="server_name" {
                    for (i=2;i<=NF;i++) {
                      gsub(/;/, "", $i)
                      if ($i==host || $i==("www." host)) in_server=1
                    }
                  }
                  in_server && $1=="root" {
                    gsub(/;/, "", $2)
                    print $2
                    exit
                  }
                  in_server && $1=="}" { in_server=0 }
                ')
                if [ -n "$NR" ]; then
                  case " $ROOTS " in
                    *" $NR "*) ;;
                    *) ROOTS="$ROOTS $NR" ;;
                  esac
                fi
              fi
            fi

            # C) Always include known app paths
            for cand in "$APP_ROOT" "$APP_ROOT/gens-frontend"; do
              if [ -d "$cand" ]; then
                case " $ROOTS " in
                  *" $cand "*) ;;
                  *) ROOTS="$ROOTS $cand" ;;
                esac
              fi
            done

            ROOTS=$(echo "$ROOTS" | xargs)
            if [ -z "$ROOTS" ]; then
              echo "ERROR: no web roots found" >&2
              exit 1
            fi
            echo "Deploy targets:$ROOTS" >&2
            echo "$ROOTS"
          EOS
          )

          echo "WEB_ROOTS=$ROOTS"
          echo "WEB_ROOTS=$ROOTS" >> $GITHUB_OUTPUT
          # primary = first root (used in logs)
          PRIMARY=$(echo "$ROOTS" | awk '{print $1}')
          echo "WEB_ROOT=$PRIMARY" >> $GITHUB_OUTPUT

      - name: Prepare Server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << EOF
            set -e
            mkdir -p ${{ steps.env.outputs.APP_ROOT }}/api
            for d in ${{ steps.webroot.outputs.WEB_ROOTS }}; do
              mkdir -p "\$d"
            done
          EOF

      - name: Deploy Angular Frontend
        run: |
          set -e
          SHA="${{ github.sha }}"
          NEW_MAIN="${{ steps.buildmeta.outputs.NEW_MAIN }}"
          WEB_ROOTS="${{ steps.webroot.outputs.WEB_ROOTS }}"

          mkdir -p frontend/dist/gens-frontend/browser/assets
          echo "$SHA" > frontend/dist/gens-frontend/browser/assets/deploy-version.txt
          date -u +"deployed_at=%Y-%m-%dT%H:%M:%SZ" >> frontend/dist/gens-frontend/browser/assets/deploy-version.txt
          echo "main=$NEW_MAIN" >> frontend/dist/gens-frontend/browser/assets/deploy-version.txt

          rsync_frontend() {
            local dest="$1"
            echo "→ rsync frontend → $dest"
            set +e
            rsync -avz --delete \
              --omit-dir-times \
              --no-perms \
              --no-owner \
              --no-group \
              --exclude api \
              --exclude gens-frontend \
              --exclude '.env' \
              --exclude 'node_modules' \
              frontend/dist/gens-frontend/browser/ \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${dest}"
            local code=$?
            set -e
            if [ $code -eq 0 ] || [ $code -eq 23 ]; then
              return 0
            fi
            echo "ERROR: rsync to ${dest} failed with code $code"
            return $code
          }

          for dest in $WEB_ROOTS; do
            rsync_frontend "${dest%/}/"
          done

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            WEB_ROOTS="$WEB_ROOTS" SHA="$SHA" NEW_MAIN="$NEW_MAIN" bash -s << 'EOF'
            set -e
            ok=0
            for dest in $WEB_ROOTS; do
              echo "=== check $dest ==="
              ls -la "$dest/index.html" "$dest/$NEW_MAIN" "$dest/assets/deploy-version.txt" || true
              if [ -f "$dest/$NEW_MAIN" ] && grep -q "$SHA" "$dest/assets/deploy-version.txt"; then
                echo "OK on disk: $dest"
                ok=1
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: new build not found on any deploy target"
              exit 1
            fi
          EOF

      - name: Deploy Node.js API
        run: |
          set +e
          rsync -avz \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=upload \
            --exclude=uploads \
            --exclude=.git \
            backend/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ steps.env.outputs.APP_ROOT }}/api/
          code=$?
          set -e
          if [ $code -eq 0 ] || [ $code -eq 23 ]; then
            if [ $code -eq 23 ]; then
              ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
                "test -f ${{ steps.env.outputs.APP_ROOT }}/api/server.js"
            fi
            exit 0
          fi
          echo "ERROR: api rsync failed with code $code"
          exit $code

      - name: Install Dependencies and Restart PM2
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << EOF
            set -e
            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
            export PATH="\$PATH:/usr/local/bin:\$HOME/.nvm/versions/node/\$(ls \$HOME/.nvm/versions/node 2>/dev/null | tail -1)/bin"

            which npm || { echo "npm not found"; exit 127; }
            which pm2 || npm install -g pm2

            APP_ROOT="${{ steps.env.outputs.APP_ROOT }}"
            PM2_NAME="${{ steps.env.outputs.PM2_NAME }}"
            cd "\$APP_ROOT/api"

            node --check server.js
            node --check app/controller/tenant/appApi.js
            npm ci --omit=dev

            pm2 delete "\$PM2_NAME" || true
            pm2 start server.js --name "\$PM2_NAME" --cwd "\$APP_ROOT/api"
            pm2 save
            sleep 3
            pm2 jlist | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); const p=d.find(x=>x.name===process.argv[1]); if(!p||p.pm2_env.status!=='online'){console.error('PM2 not online', p&&p.pm2_env&&p.pm2_env.status); process.exit(1)}; console.log('PM2 online:', p.name)" "\$PM2_NAME"
          EOF

      - name: Post-deploy health check
        run: |
          set -e
          BASE="${{ steps.env.outputs.HEALTH_URL }}"
          NEW_MAIN="${{ steps.buildmeta.outputs.NEW_MAIN }}"
          SHA="${{ github.sha }}"

          # 1) Site responds
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${BASE}/" || echo "000")
          echo "Home HTTP $code"
          [ "$code" != "000" ]

          # 2) REAL proof: new hashed main-*.js must be served as JS (not SPA index.html)
          #    Retry a few times in case of brief nginx cache / disk flush delay
          ok=0
          for i in 1 2 3 4 5; do
            ctype=$(curl -sI --max-time 20 "${BASE}/${NEW_MAIN}" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}')
            hcode=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${BASE}/${NEW_MAIN}" || echo "000")
            echo "Attempt $i: ${BASE}/${NEW_MAIN} → HTTP $hcode Content-Type: $ctype"
            if [ "$hcode" = "200" ] && echo "$ctype" | grep -Eq 'javascript|ecmascript|text/plain'; then
              # ensure body is not HTML fallback
              body_start=$(curl -s --max-time 20 "${BASE}/${NEW_MAIN}" | head -c 80)
              if ! echo "$body_start" | grep -qi '<!DOCTYPE\|<html'; then
                ok=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "ERROR: public site is still not serving the new bundle ${NEW_MAIN}"
            echo "Home page still references:"
            curl -sL --max-time 20 "${BASE}/" | grep -oE 'main-[A-Za-z0-9]+\.js' | head -3 || true
            echo ""
            echo "Likely causes:"
            echo "  1) SERVER_HOST secret is a different machine than DNS for ${{ steps.env.outputs.SITE_HOST }}"
            echo "  2) Another reverse-proxy/CDN sits in front and caches old files"
            echo "  3) Nginx root is outside the paths we rsynced"
            echo "On the REAL web server run:"
            echo "  curl -sI https://${{ steps.env.outputs.SITE_HOST }}/ | head"
            echo "  find /var/www -name '${NEW_MAIN}' 2>/dev/null"
            echo "  sudo nginx -T | grep -A25 '${{ steps.env.outputs.SITE_HOST }}'"
            exit 1
          fi

          # 3) Optional stamp check (warn only — some nginx configs rewrite unknown assets)
          ver=$(curl -s --max-time 20 "${BASE}/assets/deploy-version.txt" || true)
          if echo "$ver" | grep -q "$SHA"; then
            echo "deploy-version.txt OK"
          else
            echo "WARN: deploy-version.txt not publicly readable (SPA rewrite). Bundle check passed so deploy is OK."
          fi

          echo "SUCCESS: live is serving ${NEW_MAIN} (commit $SHA)"

      - name: Deploy summary
        run: |
          echo "Environment: ${{ steps.env.outputs.ENV_NAME }}"
          echo "App root: ${{ steps.env.outputs.APP_ROOT }}"
          echo "Deploy targets: ${{ steps.webroot.outputs.WEB_ROOTS }}"
          echo "New bundle: ${{ steps.buildmeta.outputs.NEW_MAIN }}"
          echo "PM2: ${{ steps.env.outputs.PM2_NAME }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check: ${{ steps.env.outputs.HEALTH_URL }}/${{ steps.buildmeta.outputs.NEW_MAIN }}"
