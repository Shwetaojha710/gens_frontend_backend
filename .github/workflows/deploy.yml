name: Deploy GENS

on:
  push:
    branches:
      - main      # Live  → gens.demoquaeretech.in
      - staging   # Test  → gensdemo.demoquaeretech.in
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set deploy environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_ROOT=/var/www/html/gens.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "SITE_HOST=gens.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "PM2_NAME=gens" >> $GITHUB_OUTPUT
            echo "ENV_NAME=live" >> $GITHUB_OUTPUT
            echo "HEALTH_URL=https://gens.demoquaeretech.in" >> $GITHUB_OUTPUT
          else
            echo "APP_ROOT=/var/www/html/gensdemo.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "SITE_HOST=gensdemo.demoquaeretech.in" >> $GITHUB_OUTPUT
            echo "PM2_NAME=gens-staging" >> $GITHUB_OUTPUT
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "HEALTH_URL=https://gensdemo.demoquaeretech.in" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Angular Frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Verify frontend build output
        run: |
          if [ ! -f frontend/dist/gens-frontend/browser/index.html ]; then
            echo "ERROR: frontend build missing index.html"
            ls -la frontend/dist/gens-frontend/ || true
            ls -la frontend/dist/gens-frontend/browser/ || true
            exit 1
          fi
          echo "Frontend build OK"

      - name: Syntax-check backend before deploy
        working-directory: backend
        run: |
          node --check server.js
          node --check app/controller/tenant/appApi.js
          node --check app/helper/helper.js
          node --check app/models/empPersonal.js
          echo "Backend syntax OK"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "ERROR: SERVER_HOST secret is empty"
            exit 1
          fi

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Detect nginx web root
        id: webroot
        run: |
          set -e
          APP_ROOT="${{ steps.env.outputs.APP_ROOT }}"
          SITE_HOST="${{ steps.env.outputs.SITE_HOST }}"

          WEB_ROOT=$(ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            APP_ROOT="$APP_ROOT" SITE_HOST="$SITE_HOST" bash -s << 'EOS'
            set -e
            ROOT=""

            # 1) Parse nginx config for this server_name
            if command -v nginx >/dev/null 2>&1; then
              CONF=$(nginx -T 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                ROOT=$(printf '%s\n' "$CONF" | awk -v host="$SITE_HOST" '
                  $1=="server_name" {
                    for (i=2;i<=NF;i++) {
                      gsub(/;/, "", $i)
                      if ($i==host || $i==("www." host)) in_server=1
                    }
                  }
                  in_server && $1=="root" {
                    gsub(/;/, "", $2)
                    print $2
                    exit
                  }
                  in_server && $1=="}" { in_server=0 }
                ')
              fi
            fi

            # 2) Grep common nginx dirs
            if [ -z "$ROOT" ]; then
              for d in /etc/nginx /usr/local/nginx/conf /etc/nginx/sites-enabled /etc/nginx/conf.d; do
                [ -d "$d" ] || continue
                HIT=$(grep -RIl --include='*.conf' -e "$SITE_HOST" "$d" 2>/dev/null | head -1 || true)
                if [ -n "$HIT" ]; then
                  ROOT=$(awk '
                    $1=="root" { gsub(/;/, "", $2); print $2; exit }
                  ' "$HIT")
                  [ -n "$ROOT" ] && break
                fi
              done
            fi

            # 3) Fallbacks that often exist on this stack
            if [ -z "$ROOT" ]; then
              for cand in \
                "$APP_ROOT" \
                "$APP_ROOT/gens-frontend" \
                "$APP_ROOT/public" \
                "$APP_ROOT/html" \
                "/var/www/html/$SITE_HOST" \
                "/var/www/$SITE_HOST" \
                "/home/*/public_html/$SITE_HOST"
              do
                # shellcheck disable=SC2086
                for path in $cand; do
                  if [ -f "$path/index.html" ]; then
                    ROOT="$path"
                    break 2
                  fi
                done
              done
            fi

            if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
              echo "ERROR: could not detect nginx root for $SITE_HOST" >&2
              echo "Tried APP_ROOT=$APP_ROOT" >&2
              ls -la "$APP_ROOT" 2>/dev/null || true
              exit 1
            fi

            echo "Detected WEB_ROOT=$ROOT" >&2
            echo "$ROOT"
          EOS
          )

          echo "WEB_ROOT=$WEB_ROOT"
          echo "WEB_ROOT=$WEB_ROOT" >> $GITHUB_OUTPUT

      - name: Prepare Server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            mkdir -p "${{ steps.webroot.outputs.WEB_ROOT }}"
            mkdir -p "${{ steps.env.outputs.APP_ROOT }}/api"
            mkdir -p "${{ steps.env.outputs.APP_ROOT }}/gens-frontend"
          EOF

      - name: Deploy Angular Frontend
        run: |
          set -e
          WEB_ROOT="${{ steps.webroot.outputs.WEB_ROOT }}"
          APP_ROOT="${{ steps.env.outputs.APP_ROOT }}"
          SHA="${{ github.sha }}"

          # Put stamp under assets/ so SPA try_files does not rewrite it to index.html
          mkdir -p frontend/dist/gens-frontend/browser/assets
          echo "$SHA" > frontend/dist/gens-frontend/browser/assets/deploy-version.txt
          date -u +"deployed_at=%Y-%m-%dT%H:%M:%SZ" >> frontend/dist/gens-frontend/browser/assets/deploy-version.txt
          # Also at root for SSH checks
          cp frontend/dist/gens-frontend/browser/assets/deploy-version.txt \
             frontend/dist/gens-frontend/browser/deploy-version.txt

          rsync_frontend() {
            local dest="$1"
            set +e
            rsync -avz --delete \
              --omit-dir-times \
              --no-perms \
              --no-owner \
              --no-group \
              --exclude api \
              --exclude gens-frontend \
              --exclude '.env' \
              --exclude 'node_modules' \
              frontend/dist/gens-frontend/browser/ \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${dest}"
            local code=$?
            set -e
            if [ $code -eq 0 ] || [ $code -eq 23 ]; then
              return 0
            fi
            echo "ERROR: rsync to ${dest} failed with code $code"
            return $code
          }

          echo "Deploying frontend to nginx root: $WEB_ROOT"
          rsync_frontend "${WEB_ROOT%/}/"

          # Keep legacy folders updated too (harmless if same path)
          if [ "${WEB_ROOT%/}" != "${APP_ROOT%/}" ]; then
            rsync_frontend "${APP_ROOT%/}/"
          fi
          if [ "${WEB_ROOT%/}" != "${APP_ROOT%/}/gens-frontend" ]; then
            rsync_frontend "${APP_ROOT%/}/gens-frontend/"
          fi

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            WEB_ROOT="$WEB_ROOT" SHA="$SHA" bash -s << 'EOF'
            set -e
            echo "=== nginx web root files ==="
            ls -la "$WEB_ROOT/index.html" "$WEB_ROOT/assets/deploy-version.txt"
            echo "=== deploy-version.txt ==="
            cat "$WEB_ROOT/assets/deploy-version.txt"
            grep -q "$SHA" "$WEB_ROOT/assets/deploy-version.txt"
            echo "Frontend verified on disk at $WEB_ROOT for $SHA"
          EOF

      # GitHub: backend/  →  Server: api/
      - name: Deploy Node.js API
        run: |
          set +e
          rsync -avz \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=upload \
            --exclude=uploads \
            --exclude=.git \
            backend/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ steps.env.outputs.APP_ROOT }}/api/
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            exit 0
          fi
          if [ $code -eq 23 ]; then
            echo "WARN: rsync exit 23 (partial attrs) — verifying server.js on server"
            ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "test -f ${{ steps.env.outputs.APP_ROOT }}/api/server.js"
            exit 0
          fi
          echo "ERROR: api rsync failed with code $code"
          exit $code

      - name: Install Dependencies and Restart PM2
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << EOF
            set -e
            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
            export PATH="\$PATH:/usr/local/bin:\$HOME/.nvm/versions/node/\$(ls \$HOME/.nvm/versions/node 2>/dev/null | tail -1)/bin"

            which npm || { echo "npm not found"; exit 127; }
            which pm2 || npm install -g pm2

            APP_ROOT="${{ steps.env.outputs.APP_ROOT }}"
            PM2_NAME="${{ steps.env.outputs.PM2_NAME }}"
            cd "\$APP_ROOT/api"

            node --check server.js
            node --check app/controller/tenant/appApi.js

            npm ci --omit=dev

            pm2 delete "\$PM2_NAME" || true
            pm2 start server.js --name "\$PM2_NAME" --cwd "\$APP_ROOT/api"
            pm2 save

            sleep 3
            pm2 describe "\$PM2_NAME" || true
            pm2 jlist | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); const p=d.find(x=>x.name===process.argv[1]); if(!p||p.pm2_env.status!=='online'){console.error('PM2 not online', p&&p.pm2_env&&p.pm2_env.status); process.exit(1)}; console.log('PM2 online:', p.name)" "\$PM2_NAME"
          EOF

      - name: Post-deploy health check
        run: |
          set -e
          BASE="${{ steps.env.outputs.HEALTH_URL }}"
          SHA="${{ github.sha }}"
          WEB_ROOT="${{ steps.webroot.outputs.WEB_ROOT }}"

          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${BASE}/" || echo "000")
          echo "Health HTTP $code for ${BASE}/"
          if [ "$code" = "000" ]; then
            echo "ERROR: live host unreachable after deploy"
            exit 1
          fi

          # Prefer assets/ path (not rewritten by Angular SPA try_files)
          remote_ver=$(curl -s --max-time 20 "${BASE}/assets/deploy-version.txt" || true)
          echo "Live /assets/deploy-version.txt:"
          echo "$remote_ver" | head -c 400
          echo

          if echo "$remote_ver" | grep -q "<!DOCTYPE html"; then
            echo "ERROR: nginx returned index.html for deploy-version.txt"
            echo "Detected WEB_ROOT was: $WEB_ROOT"
            echo "That path is NOT the vhost root nginx uses for ${{ steps.env.outputs.SITE_HOST }}"
            echo "On server run: sudo nginx -T | grep -A20 '${{ steps.env.outputs.SITE_HOST }}'"
            exit 1
          fi

          if ! echo "$remote_ver" | grep -q "$SHA"; then
            echo "ERROR: public site is not serving this commit ($SHA)"
            exit 1
          fi

          echo "Live frontend matches commit $SHA (web root: $WEB_ROOT)"

      - name: Deploy summary
        run: |
          echo "Environment: ${{ steps.env.outputs.ENV_NAME }}"
          echo "App root: ${{ steps.env.outputs.APP_ROOT }}"
          echo "Nginx web root: ${{ steps.webroot.outputs.WEB_ROOT }}"
          echo "PM2: ${{ steps.env.outputs.PM2_NAME }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check: ${{ steps.env.outputs.HEALTH_URL }}/assets/deploy-version.txt"
