<div class="pm-nb">
  <div class="pm-nb__ylabel">Potential →</div>
  <div class="pm-nb__grid">
    <ng-container *ngFor="let row of potentialRows; let r = index">
      <div class="pm-nb__rowlabel">{{ row }}</div>
      <button
        type="button"
        *ngFor="let cell of cells.slice(r * 3, r * 3 + 3)"
        class="pm-nb__cell"
        [ngClass]="'pm-nb__cell--' + tone(cell.performanceBand, cell.potentialRating)"
        [class.pm-nb__cell--active]="selected === cell"
        (click)="select(cell)"
      >
        <span class="pm-nb__count">{{ cell.count }}</span>
        <span class="pm-nb__label">{{ cell.label }}</span>
      </button>
    </ng-container>
    <div></div>
    <div class="pm-nb__collabel">Low</div>
    <div class="pm-nb__collabel">Moderate</div>
    <div class="pm-nb__collabel">High</div>
  </div>
  <div class="pm-nb__xlabel">Performance →</div>
  <p class="text-muted small mb-0 mt-2" *ngIf="total === 0">
    Employees appear here once their manager has submitted a rating and potential.
  </p>

  <div *ngIf="selected" class="pm-nb__list mt-3">
    <div class="fw-semibold mb-2">{{ selected.label }} · {{ selected.count }} employee(s)</div>
    <div *ngIf="!selected.employees.length" class="text-muted small">No employees in this box.</div>
    <ul class="list-unstyled mb-0">
      <li *ngFor="let e of selected.employees" class="d-flex justify-content-between py-1 border-bottom">
        <a href="javascript:void(0)" (click)="employeeClick.emit(e.reviewId)">
          {{ e.name }} <span class="text-muted small" *ngIf="e.empCode">({{ e.empCode }})</span>
        </a>
        <span class="small">{{ fmtRating(e.finalRating) }}</span>
      </li>
    </ul>
  </div>
</div>
