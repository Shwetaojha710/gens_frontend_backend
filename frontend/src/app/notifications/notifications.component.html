<div class="container-fluid mt-4 notif-page">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
    <div>
      <h4 class="mb-1">Notifications</h4>
      <p class="text-muted mb-0 small">
        Leave requests, birthdays, and work anniversaries
      </p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button
        type="button"
        class="btn btn-sm btn-outline-primary"
        *ngIf="unreadCount > 0"
        (click)="markAllRead()"
        [disabled]="loading"
      >
        <i class="ri ri-check-double-line"></i> Mark all read
      </button>
      <button type="button" class="btn btn-sm btn-primary" (click)="load()" [disabled]="loading">
        <i class="ri ri-refresh-line"></i> Refresh
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="notif-page__tabs mb-3">
        <button
          type="button"
          class="notif-page__tab"
          [class.active]="activeTab === 'all'"
          (click)="selectTab('all')"
        >
          All <span>{{ items.length }}</span>
        </button>
        <button
          type="button"
          class="notif-page__tab"
          [class.active]="activeTab === 'unread'"
          (click)="selectTab('unread')"
        >
          Unread <span>{{ unreadCount }}</span>
        </button>
        <button
          type="button"
          class="notif-page__tab"
          [class.active]="activeTab === 'read'"
          (click)="selectTab('read')"
        >
          Read <span>{{ readCount }}</span>
        </button>
      </div>

      <div class="text-muted py-5 text-center" *ngIf="loading">Loading notifications…</div>

      <ng-container *ngIf="!loading">
        <div class="notif-page__list" *ngIf="filteredItems.length; else empty">
          <button
            type="button"
            class="notif-page__row"
            *ngFor="let n of filteredItems"
            [class.unread]="!n.read"
            (click)="openItem(n)"
          >
            <div class="notif-page__icon" [attr.data-type]="n.type">
              <i class="ri" [ngClass]="n.icon || 'ri-notification-3-line'"></i>
            </div>
            <div class="notif-page__body">
              <div class="d-flex justify-content-between gap-2 align-items-start">
                <div class="notif-page__title">
                  {{ n.title }}
                  <span class="notif-page__dot" *ngIf="!n.read"></span>
                </div>
                <small class="text-muted text-nowrap">{{ n.time }}</small>
              </div>
              <div class="notif-page__msg">{{ n.message }}</div>
            </div>
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary notif-page__mark"
              *ngIf="!n.read"
              title="Mark as read"
              (click)="markOneRead(n, $event)"
            >
              <i class="ri ri-check-line"></i>
              <span class="d-none d-md-inline"> Mark read</span>
            </button>
          </button>
        </div>
        <ng-template #empty>
          <div class="text-center text-muted py-5">
            <i class="ri ri-notification-off-line" style="font-size: 2rem;"></i>
            <p class="mt-2 mb-0">
              {{ activeTab === 'unread' ? 'No unread notifications.' : activeTab === 'read' ? 'No read notifications yet.' : 'No notifications.' }}
            </p>
          </div>
        </ng-template>
      </ng-container>
    </div>
  </div>
</div>
