<header class="top-header">
  <div class="top-header-inner">

    <!-- Mobile hamburger — visible only on mobile (<992px) -->
    <button type="button" class="hamburger-btn d-lg-none" (click)="mobileMenu.toggle()" aria-label="Open menu">
      <i class="ri ri-menu-line"></i>
    </button>

    <div class="header-search-shell">
      <button type="button" class="search-icon-btn" aria-label="Search" (click)="searchInputRef.focus()">
        <i class="ri ri-search-line"></i>
      </button>
      <input
        #searchInputRef
        type="text"
        class="search-input"
        placeholder="Search pages e.g. payroll, attendance..."
        [(ngModel)]="searchQuery"
        (input)="onSearchInput()"
        (focus)="onSearchFocus()"
        (keydown)="onSearchKeydown($event)"
        autocomplete="off"
      />
      <span class="search-shortcut" *ngIf="!searchQuery">CTRL + K</span>
      <button *ngIf="searchQuery" type="button" class="search-clear-btn" aria-label="Clear search" (click)="clearSearch()">
        <i class="ri ri-close-line"></i>
      </button>

      <div class="search-results-panel" *ngIf="showResults">
        <ng-container *ngIf="searchResults.length; else noResults">
          <button
            type="button"
            class="search-result-item"
            *ngFor="let result of searchResults; let i = index"
            [class.active]="i === activeResultIndex"
            (mouseenter)="activeResultIndex = i"
            (click)="selectResult(result)"
          >
            <i class="ri" [ngClass]="result.icon"></i>
            <span class="result-text">
              <span class="result-title">{{ result.title }}</span>
              <span class="result-group" *ngIf="result.group">{{ result.group }}</span>
            </span>
          </button>
        </ng-container>
        <ng-template #noResults>
          <div class="search-no-results">No pages found for "{{ searchQuery }}"</div>
        </ng-template>
      </div>
    </div>

    <div class="header-actions">
      <div class="header-utilities">
        <!-- <button type="button" class="utility-btn" aria-label="Translate">
          <i class="ri ri-translate-2"></i>
        </button>
        <button type="button" class="utility-btn" aria-label="Theme">
          <i class="ri ri-sun-line"></i>
        </button>
        <button type="button" class="utility-btn" aria-label="Favorites">
          <i class="ri ri-star-line"></i>
        </button>
        <button type="button" class="utility-btn notification-btn" aria-label="Notifications">
          <i class="ri ri-notification-3-line"></i>
          <span class="notification-dot"></span>
        </button> -->
      </div>

      <div class="header-cta-group">
        <ng-select
          [items]="branchList"
          bindLabel="name"
          bindValue="id"
          placeholder="Select Branch"
          class="branch-selector"
          name="branch"
          [(ngModel)]="obj['branchId']"
          (ngModelChange)="onBranchChange($event)"
          #branchIdRef="ngModel"
        >
        </ng-select>

        <a *ngIf="showLocationButton" routerLink="/layout/tracking" class="location-btn">
          <i class="ri ri-route-line"></i>
          <span>Location</span>
        </a>
      </div>

      <div class="profile-shell" (click)="toggleshow()">
        <button type="button" class="profile-trigger">
          <div class="profile-avatar">
            <img src="assets/img/logo/quaere_logo_1.PNG" alt="avatar" class="rounded-circle" />
            <span class="profile-status"></span>
          </div>
        </button>

        <div class="profile-dropdown" [class.show]="isDropdownOpen">
          <div class="profile-dropdown-head">
            <div class="profile-avatar large">
              <img src="assets/img/logo/quaere_logo_1.PNG" alt="alt" class="rounded-circle" />
              <span class="profile-status"></span>
            </div>
            <div class="profile-meta">
              <h6>{{ personalDetail['name'] }}</h6>
              <p>{{ personalDetail['role'] }}</p>
              <span>{{ personalDetail['email'] }}</span>
            </div>
          </div>

          <button type="button" class="profile-logout-btn" (click)="logout()">
            <span>Logout</span>
            <i class="ri ri-logout-box-r-line"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
