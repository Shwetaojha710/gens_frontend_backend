<header class="top-header">
  <div class="top-header-inner">

    <!-- Mobile hamburger — visible only on mobile (<992px) -->
    <button type="button" class="hamburger-btn d-lg-none" (click)="mobileMenu.toggle()" aria-label="Open menu">
      <i class="ri ri-menu-line"></i>
    </button>

    <div class="header-search-shell">
      <button type="button" class="search-icon-btn" aria-label="Search" (click)="searchInputRef.focus()">
        <i class="ri ri-search-line"></i>
      </button>
      <input
        #searchInputRef
        type="text"
        class="search-input"
        placeholder="Search pages e.g. payroll, attendance..."
        [(ngModel)]="searchQuery"
        (input)="onSearchInput()"
        (focus)="onSearchFocus()"
        (keydown)="onSearchKeydown($event)"
        autocomplete="off"
      />
      <span class="search-shortcut" *ngIf="!searchQuery">CTRL + K</span>
      <button *ngIf="searchQuery" type="button" class="search-clear-btn" aria-label="Clear search" (click)="clearSearch()">
        <i class="ri ri-close-line"></i>
      </button>

      <div class="search-results-panel" *ngIf="showResults">
        <ng-container *ngIf="searchResults.length; else noResults">
          <button
            type="button"
            class="search-result-item"
            *ngFor="let result of searchResults; let i = index"
            [class.active]="i === activeResultIndex"
            (mouseenter)="activeResultIndex = i"
            (click)="selectResult(result)"
          >
            <i class="ri" [ngClass]="result.icon"></i>
            <span class="result-text">
              <span class="result-title">{{ result.title }}</span>
              <span class="result-group" *ngIf="result.group">{{ result.group }}</span>
            </span>
          </button>
        </ng-container>
        <ng-template #noResults>
          <div class="search-no-results">No pages found for "{{ searchQuery }}"</div>
        </ng-template>
      </div>
    </div>

    <div class="header-actions">
      <div class="header-utilities">
        <!-- <button type="button" class="utility-btn" aria-label="Translate">
          <i class="ri ri-translate-2"></i>
        </button>
        <button type="button" class="utility-btn" aria-label="Theme">
          <i class="ri ri-sun-line"></i>
        </button>
        <button type="button" class="utility-btn" aria-label="Favorites">
          <i class="ri ri-star-line"></i>
        </button>
        <button type="button" class="utility-btn notification-btn" aria-label="Notifications">
          <i class="ri ri-notification-3-line"></i>
          <span class="notification-dot"></span>
        </button> -->

        <div class="notif-wrap">
          <button type="button" class="utility-btn notification-btn"
                  aria-label="Notifications"
                  (click)="toggleNotifications($event)">
            <i class="ri ri-notification-3-line"></i>
            <span class="notification-dot" *ngIf="unreadCount > 0"></span>
            <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
          </button>
          <div class="notif-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
            <div class="notif-head">
              <strong>Notifications</strong>
              <div class="notif-head-actions">
                <small *ngIf="unreadCount">{{ unreadCount }} new</small>
                <button type="button" class="notif-link-btn" *ngIf="unreadCount > 0"
                        (click)="markAllRead($event)">Mark all read</button>
              </div>
            </div>
            <div class="notif-list" *ngIf="notifications.length; else emptyNotif">
              <div class="notif-item" *ngFor="let n of notifications"
                   [class.unread]="!n.read">
                <button type="button" class="notif-item-main" (click)="openNotification(n)">
                  <i class="ri" [ngClass]="n.icon"></i>
                  <div>
                    <div class="notif-title">
                      {{ n.title }}
                      <span class="notif-unread-dot" *ngIf="!n.read"></span>
                    </div>
                    <div class="notif-sub">{{ n.message }}</div>
                    <div class="notif-time">{{ n.time }}</div>
                  </div>
                </button>
                <button type="button" class="notif-mark-btn" *ngIf="!n.read"
                        title="Mark as read" (click)="markOneRead(n, $event)">
                  <i class="ri ri-check-line"></i>
                </button>
              </div>
            </div>
            <ng-template #emptyNotif>
              <div class="notif-empty">No new notifications</div>
            </ng-template>
            <div class="notif-footer">
              <a routerLink="/layout/notifications" (click)="showNotifications = false">
                View all notifications
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="header-cta-group">
        <ng-select
          [items]="branchList"
          bindLabel="name"
          bindValue="id"
          placeholder="Select Branch"
          class="branch-selector"
          name="branch"
          [(ngModel)]="obj['branchId']"
          (ngModelChange)="onBranchChange($event)"
          #branchIdRef="ngModel"
        >
        </ng-select>

        <a *ngIf="showLocationButton" routerLink="/layout/tracking" class="location-btn">
          <i class="ri ri-route-line"></i>
          <span>Location</span>
        </a>
      </div>

      <div class="profile-shell" (click)="toggleshow()">
        <button type="button" class="profile-trigger">
          <div class="profile-avatar">
            <img [src]="companyLogoUrl || defaultAvatarLogo" alt="avatar" class="rounded-circle" (error)="companyLogoSvc.onImgError($event, defaultAvatarLogo)" />
            <span class="profile-status"></span>
          </div>
        </button>

        <div class="profile-dropdown" [class.show]="isDropdownOpen" (click)="$event.stopPropagation()">
          <div class="profile-dropdown-head">
            <div class="profile-avatar large">
              <img [src]="companyLogoUrl || defaultAvatarLogo" alt="alt" class="rounded-circle" (error)="companyLogoSvc.onImgError($event, defaultAvatarLogo)" />
              <span class="profile-status"></span>
            </div>
            <div class="profile-meta">
              <h6>{{ personalDetail['name'] }}</h6>
              <p>{{ personalDetail['role'] }}</p>
              <span>{{ personalDetail['email'] }}</span>
            </div>
          </div>

          <button type="button" class="profile-edit-btn" (click)="openEditProfile($event)">
            <i class="ri ri-user-settings-line"></i>
            <span>Edit company profile</span>
          </button>

          <button type="button" class="profile-logout-btn" (click)="logout()">
            <span>Logout</span>
            <i class="ri ri-logout-box-r-line"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Edit company profile modal -->
<div class="cp-modal-backdrop" *ngIf="editProfileOpen" (click)="closeEditProfile()"></div>
<div class="cp-modal" *ngIf="editProfileOpen" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
  <div class="cp-modal__head">
    <h3>Edit company profile</h3>
    <button type="button" class="cp-modal__close" (click)="closeEditProfile()" aria-label="Close">
      <i class="ri ri-close-line"></i>
    </button>
  </div>

  <form class="cp-modal__body" (ngSubmit)="saveCompanyProfile()" novalidate>
    <div class="cp-logo-row">
      <div class="cp-logo-preview">
        <img [src]="editLogoPreview || companyLogoUrl || defaultAvatarLogo" alt="Company logo" (error)="companyLogoSvc.onImgError($event, defaultAvatarLogo)" />
      </div>
      <div class="cp-logo-actions">
        <label class="cp-file-btn">
          Change image
          <input type="file" accept="image/png,image/jpeg,image/jpg" hidden (change)="onEditLogoPick($event)" />
        </label>
        <small>PNG or JPG, max 2 MB</small>
      </div>
    </div>

    <label class="cp-field">
      <span>Company name</span>
      <input type="text" [(ngModel)]="editForm.companyName" name="companyName" maxlength="120" required />
    </label>

    <label class="cp-field">
      <span>Admin name</span>
      <input type="text" [(ngModel)]="editForm.name" name="adminName" maxlength="80" required />
    </label>

    <div class="cp-section-label">Change password <em>(optional)</em></div>

    <label class="cp-field">
      <span>Current password</span>
      <input type="password" [(ngModel)]="editForm.currentPassword" name="currentPassword" autocomplete="current-password" />
    </label>

    <label class="cp-field">
      <span>New password</span>
      <input type="password" [(ngModel)]="editForm.newPassword" name="newPassword" autocomplete="new-password" minlength="6" />
    </label>

    <label class="cp-field">
      <span>Confirm new password</span>
      <input type="password" [(ngModel)]="editForm.confirmPassword" name="confirmPassword" autocomplete="new-password" />
    </label>

    <div class="cp-modal__foot">
      <button type="button" class="cp-btn cp-btn--ghost" (click)="closeEditProfile()" [disabled]="editSaving">
        Cancel
      </button>
      <button type="submit" class="cp-btn cp-btn--primary" [disabled]="editSaving">
        {{ editSaving ? 'Saving…' : 'Save changes' }}
      </button>
    </div>
  </form>
</div>
