<div class="authentication-wrapper authentication-cover">
  <div
    class="authentication-inner row m-0"
    style="background-image: url('/assets/img/bg-login/Login1.png');background-size: cover;background-repeat: no-repeat;background-position: center;z-index: 0;"
  >
    <div class="d-none d-lg-flex col-lg-7 col-xl-8 align-items-center justify-content-center p-12 pb-2">
      <img src="../../../assets/img/bg-login/Hero.png" class="auth-cover-illustration w-100" alt="auth-illustration" />
      <img
        alt="mask"
        src="assets/img/illustrations/auth-basic-login-mask-light.png"
        class="authentication-image d-none d-lg-block"
      />
    </div>

    <div
      class="d-flex col-12 col-lg-5 col-xl-4 align-items-center justify-content-center position-relative py-sm-6 px-12 py-6"
      style="background-image: url('/assets/img/bg-login/Rectangle3.png');background-size: cover;background-position: center;background-repeat: no-repeat;"
    >
      <div class="auth-shell">
        <div class="auth-shell-inner">
          <div class="w-px-400 mx-auto pt-12 pt-lg-0">
            <div class="text-center mb-3">
              <a href="" class="text-center mx-auto w-100">
                <img src="../../../assets/img/marketing/gens-logo.png" alt="Company Logo" width="30%" />
              </a>
            </div>

            <ng-container *ngIf="!tokenMissing; else invalidTokenBlock">
              <ng-container *ngIf="!resetDone; else doneBlock">
                <h4 class="mb-1">Set New Password</h4>
                <p class="mb-5">Enter your new password below.</p>

                <form class="mb-5" [formGroup]="form" (ngSubmit)="submit()">
                  <div class="form-floating form-floating-outline mb-4 position-relative">
                    <input
                      [type]="showNew ? 'text' : 'password'"
                      class="form-control"
                      formControlName="newPassword"
                      [ngClass]="{ 'is-invalid': isInvalid('newPassword') }"
                      placeholder="New Password"
                      autofocus
                    />
                    <label>New Password</label>
                    <span
                      class="ri"
                      [ngClass]="showNew ? 'ri-eye-off-line' : 'ri-eye-line'"
                      (click)="showNew = !showNew"
                      style="cursor:pointer;position:absolute;top:50%;right:12px;transform:translateY(-50%);"
                    ></span>
                    <div class="invalid-feedback">Password must be at least 6 characters.</div>
                  </div>

                  <div class="form-floating form-floating-outline mb-4 position-relative">
                    <input
                      [type]="showConfirm ? 'text' : 'password'"
                      class="form-control"
                      formControlName="confirmPassword"
                      [ngClass]="{ 'is-invalid': isInvalid('confirmPassword') }"
                      placeholder="Confirm Password"
                    />
                    <label>Confirm Password</label>
                    <span
                      class="ri"
                      [ngClass]="showConfirm ? 'ri-eye-off-line' : 'ri-eye-line'"
                      (click)="showConfirm = !showConfirm"
                      style="cursor:pointer;position:absolute;top:50%;right:12px;transform:translateY(-50%);"
                    ></span>
                    <div class="invalid-feedback">Passwords do not match.</div>
                  </div>

                  <button type="submit" class="btn btn-primary d-grid w-100" [disabled]="form.invalid || loading">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
                    Reset Password
                  </button>
                </form>
              </ng-container>
            </ng-container>

            <ng-template #doneBlock>
              <div class="alert alert-success text-center mb-4">
                Password reset successfully! You can now log in with your new password.
              </div>
              <a routerLink="/superadmin/login" class="btn btn-primary d-grid w-100">Go to Login</a>
            </ng-template>

            <ng-template #invalidTokenBlock>
              <div class="alert alert-danger text-center mb-4">
                This reset link is invalid or has expired. Please request a new one.
              </div>
              <a routerLink="/superadmin/forgot-password" class="btn btn-outline-primary d-grid w-100">Request New Link</a>
            </ng-template>

            <div class="text-center mt-3" *ngIf="!resetDone && !tokenMissing">
              <a routerLink="/superadmin/login" class="text-primary" style="font-size:14px;">
                <i class="ri-arrow-left-line me-1"></i> Back to Login
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
