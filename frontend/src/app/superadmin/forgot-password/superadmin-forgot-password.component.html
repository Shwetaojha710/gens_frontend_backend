<div class="authentication-wrapper authentication-cover">
  <div
    class="authentication-inner row m-0"
    style="background-image: url('/assets/img/bg-login/Login1.png');background-size: cover;background-repeat: no-repeat;background-position: center;z-index: 0;"
  >
    <div class="d-none d-lg-flex col-lg-7 col-xl-8 align-items-center justify-content-center p-12 pb-2">
      <img src="../../../assets/img/bg-login/Hero.png" class="auth-cover-illustration w-100" alt="auth-illustration" />
      <img
        alt="mask"
        src="assets/img/illustrations/auth-basic-login-mask-light.png"
        class="authentication-image d-none d-lg-block"
      />
    </div>

    <div
      class="d-flex col-12 col-lg-5 col-xl-4 align-items-center justify-content-center position-relative py-sm-6 px-12 py-6"
      style="background-image: url('/assets/img/bg-login/Rectangle3.png');background-size: cover;background-position: center;background-repeat: no-repeat;"
    >
      <div class="auth-shell">
        <div class="auth-shell-inner">
          <div class="w-px-400 mx-auto pt-12 pt-lg-0">
            <div class="text-center mb-3">
              <a href="" class="text-center mx-auto w-100">
                <img src="../../../assets/img/logo/gens-logo-color.png" alt="Company Logo" width="30%" />
              </a>
            </div>

            <h4 class="mb-1">Forgot Password?</h4>
            <p class="mb-5">Enter your registered email and we'll send you a reset link.</p>

            <ng-container *ngIf="!submitted; else successBlock">
              <form class="mb-5" [formGroup]="form" (ngSubmit)="submit()">
                <div class="form-floating form-floating-outline mb-4">
                  <input
                    type="email"
                    class="form-control"
                    formControlName="email"
                    [ngClass]="{ 'is-invalid': isInvalid('email') }"
                    placeholder="Email"
                    autofocus
                  />
                  <label>Email</label>
                  <div class="invalid-feedback">Enter a valid email address.</div>
                </div>

                <button type="submit" class="btn btn-primary d-grid w-100" [disabled]="form.invalid || loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
                  Send Reset Link
                </button>
              </form>
            </ng-container>

            <ng-template #successBlock>
              <div class="alert alert-success text-center">
                If the email is registered, a password reset link has been sent. Please check your inbox.
              </div>
            </ng-template>

            <div class="text-center mt-3">
              <a routerLink="/superadmin/login" class="text-primary" style="font-size:14px;">
                <i class="ri-arrow-left-line me-1"></i> Back to Login
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
