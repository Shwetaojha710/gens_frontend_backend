<div class="container-fluid  mt-5">
  <div class="row mb-6" *ngIf="createFlag">
    <div class="col-md">
      <div class="card">
        <h5 class="card-header d-flex justify-content-between align-items-center">
          <span>Salary Order</span>
          <button type="button" class="btn btn-xs btn-primary float-end" (click)="back()">
            <i class="fa-solid fa-arrow-left"></i>&nbsp;back
          </button>
        </h5>

        <div class="card-body">
          <div class="row g-2">
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3">
              <label for="defaultFormControlInput" class="form-label">Name</label>
              <!-- <ng-select [items]="dependentComp" bindLabel="listLabel" [(ngModel)]="obj['component']" [multiple]="true"
                placeholder="Select Component" name="value_type" id="select2Danger"
                (change)="onComponentChange($event)">

                <ng-template ng-label-tmp let-item="item">
                  {{ item.order }}. {{ item.listLabel }}
                </ng-template>

                <ng-template ng-option-tmp let-item="item">
                  {{ item.listLabel }}
                </ng-template>
              </ng-select> -->
          <input type="text" class="form-control" id="defaultFormControlInput" placeholder="Enter Name"
                [(ngModel)]="obj['component']" aria-describedby="defaultFormControlHelp" required />




            </div>
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3">
              <label for="defaultFormControlInput" class="form-label">Order</label>
              <input type="number" class="form-control" id="defaultFormControlInput" placeholder="Enter Order"
                [(ngModel)]="obj['order']" aria-describedby="defaultFormControlHelp" required />

            </div>
            &nbsp;
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3" *ngIf="updateFlag">
              <label for="defaultFormControlInput" class="form-label">Status</label>
              <ng-select [items]="status" bindLabel="label" bindValue="value" [(ngModel)]="obj['status']"
                [multiple]="false" placeholder="Select Status" name="status" id="select2Danger">
              </ng-select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 mt-2">
              <button *ngIf="createFlag && updateFlag==false" type="button"
                class="btn btn-sm btn-primary waves-effect waves-light" (click)="onSubmit()">
                Submit
              </button>
              <button *ngIf="updateFlag" type="button" class="btn btn-sm btn-primary waves-effect waves-light"
                (click)="updatedata()">
                Update
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row mb-6">
    <div class="col-md">
      <div class="card">

        <h5 class="card-header d-flex justify-content-between align-items-center">
          <span>Salary Order List</span>
          <button *ngIf="createFlag == false" type="button" class="btn btn-xs btn-primary float-end"
            (click)="opencreate()">
            <i class="fa-solid fa-plus"></i>&nbsp;Add
          </button>
        </h5>

        <app-search-pagination [totalItems]="SalaryOrderList.length" [pageSize]="itemsPerPage"
          [currentPage]="currentPage" (search)="onSearch($event)" (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)">
          <div class="table-responsive">
            <table class="table table-striped dataTable">
            <thead>
              <tr>
                <th>SI.No</th>
                <th>Name</th>
                <th>Order
                <th>
                <th>Status</th>
                <th>createdAt</th>
                <!-- <th>Actions</th> -->
              </tr>
            </thead>
            <tbody class="table-border-bottom-0">
              <tr *ngFor="let item of SalaryOrderList; let i = index">
                <th scope="row">{{ i + 1 }}</th>
                <td>{{ item["component"] }}</td>
                <td>{{ item["order"] }}</td>
                <td>
                  <span class="badge badge-outline-success overflow-hidden px-2"
                    [ngClass]="getStatusClass(item['status'])">
                    {{ item["status"] }}
                  </span>
                </td>
                <td>{{ item["createdAt"] }}</td>

                <td>
                  <!-- <button
                    type="button"
                    class="btn btn-sm btn-outline-success"
                    (click)="update(item)"
                  >
                    <i class="fas fa-edit"></i>
                  </button> -->
                  <!-- &nbsp; -->
                  <!-- <button
                    type="button"
                    class="btn btn-sm btn-outline-danger"
                    (click)="delete(item)"
                  >
                    <i class="fas fa-trash-alt"></i>
                  </button> -->
                </td>
              </tr>
            </tbody>
          </table>
          </div>
        </app-search-pagination>

      </div>
    </div>
  </div>
</div>
