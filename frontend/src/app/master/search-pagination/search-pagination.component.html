<div class="dt-container dt-bootstrap5">
  <!-- 🔹 Top bar: Show entries & Search -->
  <div class="row mx-2 justify-content-between">
    <div
      class="d-md-flex justify-content-between align-items-center dt-layout-start col-md-auto me-auto"
    >
     <div class="dt-length">
  <label>
    Show
    <select [(ngModel)]="pageSize" (change)="onPageSizeChange($event)" class="form-select form-select-sm">
      <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
    </select>
    entries
  </label>
</div>

    </div>

    <div
      class="d-md-flex justify-content-between align-items-center dt-layout-end col-md-auto mt-0"
    >
      <div class="dt-search">
        <label>Search:</label>
        <input
          #searchInput
          type="search"
          class="form-control form-control-sm"
          placeholder="Type search here"
          (input)="onSearch($event)"
        />
      </div>
    </div>
  </div>

  <!-- 🔹 Slot for Table -->
  <div class="justify-content-between dt-layout-table mt-2">
    <ng-content></ng-content>
  </div>

  <!-- 🔹 Bottom bar: Info & Pagination -->
  <div class="row mx-3 justify-content-between mt-2">
    <div
      class="d-md-flex justify-content-between align-items-center dt-layout-start col-md-auto me-auto"
    >
      <div class="dt-info">
        Showing {{ (currentPage - 1) * pageSize + 1 }}
        to {{ getMin(currentPage * pageSize, totalItems) }}
        of {{ totalItems }} entries
      </div>
    </div>

    <div
      class="d-md-flex justify-content-between align-items-center dt-layout-end col-md-auto mt-0"
    >
      <div class="dt-paging">
        <nav aria-label="pagination">
          <ul class="pagination flex-wrap mb-0">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" href="javascript:void(0)" (click)="goToPage(currentPage - 1)">
                Prev
              </a>
            </li>

            <li
              class="page-item"
              *ngFor="let p of visiblePages; trackBy: trackPage"
              [class.active]="p === currentPage"
              [class.disabled]="p === '...'"
              [class.sp-ellipsis]="p === '...'"
            >
              <a
                class="page-link"
                href="javascript:void(0)"
                (click)="goToPage(p)"
                [attr.aria-current]="p === currentPage ? 'page' : null"
              >
                {{ p }}
              </a>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" href="javascript:void(0)" (click)="goToPage(currentPage + 1)">
                Next
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
