<article
  class="pricing-card group relative h-full flex flex-col overflow-hidden rounded-2xl
         border border-[var(--border-color)] bg-white/80 dark:bg-gens-950/70 backdrop-blur-sm
         transition-all duration-300 hover:-translate-y-1 hover:shadow-card-hover"
  [class.pricing-card--featured]="plan.highlighted"
>
  <div class="pricing-card__accent" aria-hidden="true"></div>

  <div class="relative z-[1] flex flex-col h-full p-5">
    <!-- Header -->
    <div class="flex items-start justify-between gap-2 mb-3">
      <div class="min-w-0">
        <div class="flex items-center gap-2 flex-wrap mb-1">
          <h3 class="font-display font-bold text-lg text-navy dark:text-white truncate">{{ plan.name }}</h3>
          <span
            *ngIf="plan.badge"
            class="shrink-0 px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-wide"
            [ngClass]="plan.highlighted
              ? 'bg-gens-600 text-white'
              : 'bg-gens-50 text-gens-700 dark:bg-gens-900 dark:text-gens-300'"
          >
            {{ plan.badge }}
          </span>
        </div>
      </div>
    </div>

    <p class="text-xs text-[var(--text-secondary)] leading-relaxed mb-4 line-clamp-2">
      {{ plan.description }}
    </p>

    <!-- Price -->
    <div class="mb-4 pb-4 border-b border-[var(--border-color)]">
      <div class="flex items-baseline gap-1 flex-wrap">
        <span class="font-display text-3xl font-bold gradient-text leading-none">{{ plan.price }}</span>
        <span class="text-[11px] text-[var(--text-muted)]" *ngIf="plan.period">{{ plan.period }}</span>
      </div>
    </div>

    <!-- Meta options -->
    <div class="grid grid-cols-2 gap-2 mb-4" *ngIf="plan.employees || plan.support">
      <div class="rounded-xl bg-[var(--bg-secondary)] px-2.5 py-2" *ngIf="plan.employees">
        <p class="text-[10px] uppercase tracking-wide text-[var(--text-muted)] mb-0.5">Team size</p>
        <p class="text-xs font-semibold text-navy dark:text-white">{{ plan.employees }}</p>
      </div>
      <div class="rounded-xl bg-[var(--bg-secondary)] px-2.5 py-2" *ngIf="plan.support">
        <p class="text-[10px] uppercase tracking-wide text-[var(--text-muted)] mb-0.5">Support</p>
        <p class="text-xs font-semibold text-navy dark:text-white">{{ plan.support }}</p>
      </div>
    </div>

    <!-- Capability options -->
    <div class="mb-4" *ngIf="plan.options && plan.options.length">
      <p class="text-[10px] uppercase tracking-wide text-[var(--text-muted)] mb-2">Includes</p>
      <div class="flex flex-wrap gap-1.5">
        <span
          *ngFor="let opt of plan.options"
          class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-[10px] font-medium border transition-colors"
          [ngClass]="opt.included
            ? 'border-gens-200 bg-gens-50 text-gens-800 dark:border-gens-800 dark:bg-gens-950 dark:text-gens-200'
            : 'border-[var(--border-color)] bg-transparent text-[var(--text-muted)] opacity-60'"
        >
          <i class="ri" [ngClass]="opt.included ? 'ri-check-line' : 'ri-close-line'"></i>
          {{ opt.label }}
        </span>
      </div>
    </div>

    <!-- Features (compact + expand) -->
    <ul class="space-y-1.5 mb-3 flex-1">
      <li class="flex items-start gap-1.5 text-xs text-[var(--text-secondary)]" *ngFor="let feature of visibleFeatures()">
        <i class="ri ri-checkbox-circle-fill text-gens-500 mt-0.5 shrink-0"></i>
        <span class="leading-snug">{{ feature }}</span>
      </li>
    </ul>

    <button
      type="button"
      *ngIf="hiddenCount() > 0"
      class="mb-4 self-start text-[11px] font-semibold text-gens-600 dark:text-gens-400 hover:underline"
      (click)="toggleExpanded()"
    >
      {{ expanded() ? 'Show less' : '+' + hiddenCount() + ' more features' }}
    </button>

    <button
      type="button"
      class="mt-auto w-full text-center text-sm !py-2.5 !px-4"
      [ngClass]="plan.highlighted ? 'btn-primary' : 'btn-secondary'"
      (click)="onCtaClick()"
    >
      {{ plan.ctaLabel }}
    </button>
  </div>
</article>
