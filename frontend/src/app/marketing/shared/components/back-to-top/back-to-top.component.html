@if (visible()) {
  <button
    type="button"
    (click)="scrollToTop()"
    class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-full bg-gradient-to-r from-gens-600 to-accent text-white shadow-premium hover:scale-110 transition-all duration-300 flex items-center justify-center"
    aria-label="Back to top"
  >
    <i class="ri ri-arrow-up-line text-xl"></i>
  </button>
}
