<section class="relative pt-32 pb-16 md:pt-40 md:pb-20 overflow-hidden">
  <div class="absolute inset-0 bg-hero-mesh"></div>
  <div class="absolute inset-0 bg-gradient-to-b from-gens-50/90 via-[var(--bg-primary)] to-[var(--bg-primary)] dark:from-gens-950/50"></div>
  <div class="absolute top-20 right-1/4 w-72 h-72 bg-gens-400/10 rounded-full blur-3xl"></div>

  <div class="container-gens relative z-10 text-center"  animation="fade-up">
    <span
      *ngIf="badge"
      class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-widest bg-white dark:bg-gens-950 border border-gens-200 dark:border-gens-800 text-gens-700 dark:text-gens-300 mb-6 shadow-card"
    >
      {{ badge }}
    </span>
    <h1 class="font-display text-4xl md:text-5xl lg:text-6xl font-bold text-navy dark:text-white mb-6 tracking-tight">
      {{ title }}
    </h1>
    <p *ngIf="subtitle" class="text-lg md:text-xl text-[var(--text-secondary)] max-w-2xl mx-auto mb-8 leading-relaxed">
      {{ subtitle }}
    </p>
    <a *ngIf="showCta" [routerLink]="ctaLink" class="btn-primary btn-shine">{{ ctaLabel }}</a>
  </div>
</section>
