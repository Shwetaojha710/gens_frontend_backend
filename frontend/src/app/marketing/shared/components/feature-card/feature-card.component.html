<div class="lattice-card card-hover p-6 group h-full">
  <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-gens-500/15 to-accent-light/15 flex items-center justify-center mb-4
              group-hover:scale-110 group-hover:from-gens-500/25 group-hover:to-accent-light/25 transition-all duration-300">
    <i class="text-xl text-gens-600 dark:text-gens-400" [class]="'ri ' + feature.icon"></i>
  </div>
  <h3 class="font-display font-semibold text-lg mb-2">{{ feature.title }}</h3>
  <p class="text-sm text-[var(--text-secondary)] leading-relaxed">{{ feature.description }}</p>
</div>
