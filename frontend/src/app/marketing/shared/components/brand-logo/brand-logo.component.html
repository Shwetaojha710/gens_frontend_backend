<a
  routerLink="/Home"
  class="gens-brand-logo group"
  [class.gens-brand-logo--lg]="size === 'lg'"
  [class.gens-brand-logo--md]="size === 'md'"
  [class.gens-brand-logo--sm]="size === 'sm'"
  aria-label="GENS.Ai Home"
>
  <!-- Lady / person icon -->
  <svg
    class="gens-brand-logo__icon"
    viewBox="0 0 80 90"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <defs>
      <linearGradient id="gensHead" x1="40" y1="2" x2="40" y2="28" gradientUnits="userSpaceOnUse">
        <stop stop-color="#B8E63A"/>
        <stop offset="1" stop-color="#7ED321"/>
      </linearGradient>
      <linearGradient id="gensLeft" x1="8" y1="20" x2="48" y2="88" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2DD4C8"/>
        <stop offset="0.55" stop-color="#14B8A6"/>
        <stop offset="1" stop-color="#0D9488"/>
      </linearGradient>
      <linearGradient id="gensRight" x1="72" y1="20" x2="32" y2="88" gradientUnits="userSpaceOnUse">
        <stop stop-color="#FFB347"/>
        <stop offset="0.45" stop-color="#FF8C42"/>
        <stop offset="1" stop-color="#E85D4C"/>
      </linearGradient>
    </defs>
    <!-- Left swoosh (teal) -->
    <path
      d="M14 28C22 18 34 16 40 28C36 42 28 58 18 78C12 70 10 48 14 28Z"
      fill="url(#gensLeft)"
      opacity="0.95"
    />
    <!-- Right swoosh (orange) -->
    <path
      d="M66 28C58 18 46 16 40 28C44 42 52 58 62 78C68 70 70 48 66 28Z"
      fill="url(#gensRight)"
      opacity="0.95"
    />
    <!-- Overlap body blend -->
    <path
      d="M40 28C36 40 34 52 32 64C36 58 40 52 44 46C42 40 40 34 40 28Z"
      fill="#C45A5A"
      opacity="0.55"
    />
    <!-- Head -->
    <circle cx="40" cy="16" r="12" fill="url(#gensHead)"/>
  </svg>

  <span class="gens-brand-logo__text-wrap">
    <span class="gens-brand-logo__wordmark">
      <span class="gens-brand-logo__gens">GENS</span><span class="gens-brand-logo__dot">.</span><span class="gens-brand-logo__ai">Ai<svg class="gens-brand-logo__spark" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0L7.2 4.8L12 6L7.2 7.2L6 12L4.8 7.2L0 6L4.8 4.8L6 0Z" fill="currentColor"/></svg></span>
    </span>
    @if (showTagline) {
      <span class="gens-brand-logo__tagline">Global Employee Network System</span>
    }
  </span>
</a>
