<app-page-hero
  badge="Industries"
  title="HR Solutions for Every Industry"
  subtitle="Purpose-built configurations for diverse sectors and workforce types — because no two industries manage people the same way."
/>

<section class="section-padding">
  <div class="container-gens grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" appStaggerReveal>
    @for (industry of industries; track industry.name) {
      <div class="lattice-card card-hover p-8 h-full">
        <div class="w-14 h-14 rounded-2xl bg-gens-100 dark:bg-gens-900 flex items-center justify-center mb-5">
          <i class="text-2xl text-gens-600 dark:text-gens-400" [class]="'ri ' + industry.icon"></i>
        </div>
        <h3 class="font-display font-bold text-xl mb-2">{{ industry.name }}</h3>
        <p class="text-sm text-[var(--text-secondary)] leading-relaxed">{{ industry.description }}</p>
      </div>
    }
  </div>
</section>

<app-cta-banner />
