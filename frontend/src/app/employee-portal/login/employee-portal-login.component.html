<div class="authentication-wrapper authentication-cover">
  <div
    class="authentication-inner row m-0"
    style="background-image: url('/assets/img/bg-login/Login1.png'); background-size: cover; background-repeat: no-repeat; background-position: center; z-index: 0"
  >
    <div class="d-none d-lg-flex col-lg-7 col-xl-8 align-items-center justify-content-center p-12 pb-2">
      <img src="/assets/img/bg-login/Hero.png" class="auth-cover-illustration w-100" alt="auth-illustration" />
      <img
        alt="mask"
        src="/assets/img/illustrations/auth-basic-login-mask-light.png"
        class="authentication-image d-none d-lg-block"
      />
    </div>

    <div
      class="d-flex col-12 col-lg-5 col-xl-4 align-items-center justify-content-center position-relative py-sm-6 px-12 py-6"
      style="
        background-image: url('/assets/img/bg-login/Rectangle3.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      "
    >
      <div
        style="
          padding: 50px 40px;
          background: linear-gradient(110.78deg, rgba(255, 255, 255, 0.41) 7.01%, rgba(255, 255, 255, 0.01) 106.22%),
            linear-gradient(0deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1));
          border-radius: 8px;
          min-height: 640px;
          z-index: 0;
        "
      >
        <div
          style="
            padding: 48px 32px;
            background: linear-gradient(110.78deg, rgba(255, 255, 255, 0.41) 7.01%, rgba(255, 255, 255, 0.01) 106.22%),
              linear-gradient(0deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1));
            border-radius: 8px;
            min-height: 560px;
            z-index: 0;
          "
        >
          <div class="w-px-400 mx-auto pt-8 pt-lg-0" style="z-index: 999999">
            <div class="text-center mb-3">
              <a href="/Home" class="text-center mx-auto w-100">
                <img src="/assets/img/logo/gens-logo-color.png" alt="Company Logo" width="30%" />
              </a>
            </div>
            <h4 class="mb-1">Employee portal</h4>
            <p class="mb-4">Sign in with company code &amp; mobile OTP</p>

            <div class="mb-4">
              <form *ngIf="!otpStep" id="formEmployeePortal" [formGroup]="tenantForm" (ngSubmit)="sendOtp()">
              <div>
                <div class="form-floating form-floating-outline mb-4">
                  <input
                    type="text"
                    class="form-control"
                    id="ep_company_code"
                    formControlName="tenantId"
                    [ngClass]="{ 'is-invalid': isInvalid(tenantForm, 'tenantId') }"
                    placeholder="Company code"
                    autocomplete="organization"
                  />
                  <label for="ep_company_code">Company Code</label>
                  <div class="invalid-feedback">Company code is required.</div>
                </div>

                <div class="form-floating form-floating-outline mb-4">
                  <input
                    type="tel"
                    class="form-control"
                    id="ep_mobile"
                    [formControl]="phoneControl"
                    [ngClass]="{ 'is-invalid': isInvalid(tenantForm, 'mobile') }"
                    placeholder="Mobile Number"
                    maxlength="10"
                    (input)="onPhoneInput($event)"
                  />
                  <label for="ep_mobile">Mobile Number</label>
                  <div class="invalid-feedback" *ngIf="phoneControl.touched && phoneControl.hasError('required')">
                    Mobile number is required.
                  </div>
                  <div class="invalid-feedback" *ngIf="phoneControl.touched && phoneControl.hasError('pattern')">
                    Enter a valid 10-digit mobile number starting with 6–9.
                  </div>
                </div>

                <button type="submit" class="btn btn-primary d-grid w-100" [disabled]="tenantForm.invalid || loading">
                  {{ loading ? 'Sending…' : 'Send OTP' }}
                </button>
              </div>
              </form>

              <form *ngIf="otpStep" [formGroup]="otpForm" (ngSubmit)="verify()">
              <div>
                <div class="divider mb-4">
                  <span class="divider-text">Enter OTP</span>
                </div>
                <p class="text-center mb-3 text-muted small">OTP sent to your mobile</p>
                <div class="d-flex justify-content-center gap-2 mb-4">
                  <input
                    #d1
                    type="text"
                    class="form-control text-center fs-4 fw-bold"
                    formControlName="digit1"
                    maxlength="1"
                    style="width: 56px; height: 56px"
                    inputmode="numeric"
                    (input)="onOtpInput($event, d2)"
                    (keydown)="onOtpKeydown($event, null)"
                  />
                  <input
                    #d2
                    type="text"
                    class="form-control text-center fs-4 fw-bold"
                    formControlName="digit2"
                    maxlength="1"
                    style="width: 56px; height: 56px"
                    inputmode="numeric"
                    (input)="onOtpInput($event, d3)"
                    (keydown)="onOtpKeydown($event, d1)"
                  />
                  <input
                    #d3
                    type="text"
                    class="form-control text-center fs-4 fw-bold"
                    formControlName="digit3"
                    maxlength="1"
                    style="width: 56px; height: 56px"
                    inputmode="numeric"
                    (input)="onOtpInput($event, d4)"
                    (keydown)="onOtpKeydown($event, d2)"
                  />
                  <input
                    #d4
                    type="text"
                    class="form-control text-center fs-4 fw-bold"
                    formControlName="digit4"
                    maxlength="1"
                    style="width: 56px; height: 56px"
                    inputmode="numeric"
                    (input)="onOtpInput($event, null)"
                    (keydown)="onOtpKeydown($event, d3)"
                  />
                </div>
                <button type="submit" class="btn btn-primary d-grid w-100 mb-2" [disabled]="otpForm.invalid || loading">
                  {{ loading ? 'Verifying…' : 'Verify & Login' }}
                </button>
                <button type="button" class="btn btn-outline-secondary d-grid w-100 mb-3" (click)="back()" [disabled]="loading">
                  Change number
                </button>
                <small class="text-muted d-block text-center">
                  <span *ngIf="resendTimer > 0">Resend OTP in {{ resendTimer }}s</span>
                  <a *ngIf="resendTimer === 0" class="link-info" style="cursor: pointer" (click)="sendOtp()">Resend OTP</a>
                </small>
              </div>
              </form>
            </div>

            <p class="text-center mb-0">
              <a routerLink="/login" class="link-info">Admin login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
